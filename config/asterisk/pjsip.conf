; /etc/asterisk/pjsip.conf
[system]
type=system

[global]
type=global
user_agent=Asterisk-Dograh

; UDP Transport
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=43.225.22.33
external_signaling_address=43.225.22.33

; Guest/Anonymous Endpoint (accepts inbound calls from Vobiz)
[anonymous]
type=endpoint
context=from-external
disallow=all
allow=ulaw

; Outbound Trunk to Vobiz (for dialing out)
[vobiz-out-aor]
type=aor
contact=sip:31868684.sip.vobiz.ai

[vobiz-out-auth]
type=auth
auth_type=userpass
username=dograh_asterisk
password=Reddy@7989

[vobiz-out]
type=endpoint
transport=transport-udp
context=from-external
disallow=all
allow=ulaw
outbound_auth=vobiz-out-auth
aors=vobiz-out-aor

